<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network Quest</title>
  <meta name="description" content="Network Quest: The Career Strategy RPG — a fictional career story where real-world networking actions unlock each chapter.">
  <meta name="theme-color" content="#0e1a33">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1a33'/%3E%3Cpath d='M16 5 27 16 16 27 5 16z' fill='%231a9e8f'/%3E%3Cpath d='M16 11 21 16 16 21 11 16z' fill='%23f6c453'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#stage">Skip to the story</a>
  <div class="top-sticky">
    <div id="demo-banner" class="demo-banner" role="status" hidden>Demo Mode — simulated data, no real outreach recorded.</div>
    <header id="hud" class="hud"></header>
  </div>

  <main class="layout">
    <aside id="week-panel" class="week-panel" aria-label="This week's real-world missions"></aside>
    <section id="stage" class="stage" aria-live="polite" aria-label="Story"></section>
  </main>

  <footer class="footer">
    <button type="button" class="link" data-action="real-sim">What's real vs. simulated</button>
    <span aria-hidden="true">·</span>
    <button type="button" class="link" data-action="help-open">Help &amp; glossary</button>
    <span aria-hidden="true">·</span>
    <span>Network Quest — MGTA 459 Managerial Decision Making course project demo. All progress stays in this browser.</span>
  </footer>

  <button type="button" id="demo-fab" class="demo-fab" data-action="demo-open" aria-pressed="false">🎛 Demo Mode</button>

  <div id="term-card" class="term-card" role="dialog" aria-label="Glossary term" hidden></div>

  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop" data-action="modal-close"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Network Quest needs JavaScript. Please enable it, or open this page from a static web server.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
